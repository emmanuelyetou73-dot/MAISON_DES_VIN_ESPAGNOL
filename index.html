<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Maison des Vins</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9f5f0;
            color: #2c1810;
        }

        body.mode-gestionnaire {
            background: #f0ede8;
        }

        header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e8b87c;
            padding: 2rem;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        header p {
            color: #c9a87b;
            margin-top: 0.5rem;
        }

        nav {
            background: #2c1810;
            display: flex;
            justify-content: center;
            gap: 2rem;
            padding: 1rem;
            flex-wrap: wrap;
        }

        nav a {
            color: #e8b87c;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #ffd966;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .section-title {
            font-size: 2rem;
            border-left: 5px solid #e8b87c;
            padding-left: 1rem;
            margin-bottom: 2rem;
            color: #2c1810;
        }

        .exceptions {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .exception-card {
            background: #fff;
            padding: 1rem 2rem;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            font-weight: bold;
            color: #8b5a2b;
        }

        .vitrine {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 1rem;
        }

        .carte-vin {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .carte-vin:hover {
            transform: translateY(-5px);
        }

        .carte-vin h3 {
            color: #8b3a1a;
            margin-bottom: 0.75rem;
            font-size: 1.4rem;
        }

        .carte-vin p {
            color: #555;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .prix {
            display: inline-block;
            background: #e8b87c;
            color: #2c1810;
            padding: 0.5rem 1rem;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        footer {
            background: #2c1810;
            color: #e8b87c;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }

        /* Gestionnaire */
        .admin-panel {
            display: none;
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        body.mode-gestionnaire .admin-panel {
            display: block;
        }

        body.mode-gestionnaire .vitrine-panel {
            display: none;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #8b3a1a;
            margin-bottom: 1rem;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        button {
            background: #8b3a1a;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #a0522d;
        }

        .btn-supprimer {
            background: #c0392b;
            margin-left: 0.5rem;
        }

        .btn-supprimer:hover {
            background: #a82313;
        }

        .liste-vins {
            margin-top: 1rem;
        }

        .vin-item {
            background: #f9f5f0;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .vin-info {
            flex: 1;
        }

        .vin-info strong {
            color: #8b3a1a;
        }

        .success {
            background: #27ae60;
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .success.show {
            display: block;
        }
    </style>
</head>
<body>

<header>
    <h1>🍷 LA MAISON DES VINS</h1>
    <p>GRANDS CRUS - ARTISANAUX - D'EXCEPTION</p>
</header>

<nav>
    <a onclick="changerMode('vitrine')">Accueil</a>
    <a onclick="changerMode('vitrine')">Nos vins</a>
    <a onclick="changerMode('vitrine')">Déploiements</a>
    <a onclick="changerMode('vitrine')">Emmanuelle</a>
    <a onclick="changerMode('vitrine')">Rioja</a>
    <a onclick="changerMode('gestionnaire')">Gestionnaire</a>
</nav>

<!-- VITRINE ORIGINALE -->
<div class="container vitrine-panel" id="vitrinePanel">
    <h2 class="section-title">Nos vins d'exception</h2>
    <div class="exceptions" id="exceptions-container"></div>

    <h2 class="section-title">Notre vitrine</h2>
    <div class="vitrine" id="vitrine-vins"></div>
</div>

<!-- GESTIONNAIRE (AJOUTÉ SANS CASSER LA FORME) -->
<div class="admin-panel" id="adminPanel">
    <div class="success" id="message"></div>

    <div class="card">
        <h2>📌 Modifier les 4 catégories</h2>
        <input type="text" id="cat1" placeholder="Rioja">
        <input type="text" id="cat2" placeholder="Ribera del Duero">
        <input type="text" id="cat3" placeholder="Albariño">
        <input type="text" id="cat4" placeholder="Cava">
        <button onclick="majCategories()">Mettre à jour</button>
    </div>

    <div class="card">
        <h2>➕ Ajouter un vin</h2>
        <input type="text" id="nomVin" placeholder="Nom du vin">
        <textarea id="descVin" placeholder="Description"></textarea>
        <input type="number" id="prixVin" placeholder="Prix FCFA">
        <button onclick="ajouterVin()">Ajouter</button>
    </div>

    <div class="card">
        <h2>📋 Gérer les vins</h2>
        <div id="liste-vins-container" class="liste-vins"></div>
    </div>
</div>

<footer>
    <p>© 2025 La Maison des Vins - Passion et authenticité</p>
</footer>

<script>
    // DONNÉES (CORRECTION Rijoa → Rioja déjà faite)
    function chargerDonnees() {
        const defaut = {
            categoriesException: ["Rioja", "Ribera del Duero", "Albariño", "Cava"],
            vins: [
                {
                    nom: "Dominio Valor",
                    description: "En bouchée ce vin rouge est un vin puissant avec un bel équilibre entre l'acidité et les tanins.",
                    prix: 20000
                },
                {
                    nom: "Paton Clemente",
                    description: "Paton-Clemente révèle des types d'arômes d'évolution (vieillissement, minéral & naturel ou fermentés) et parfois aussi des arômes végétal, boisés ou épices.",
                    prix: 29997
                }
            ]
        };
        const stock = localStorage.getItem("maisonDesVins");
        if (!stock) {
            localStorage.setItem("maisonDesVins", JSON.stringify(defaut));
            return defaut;
        }
        return JSON.parse(stock);
    }

    function sauvegarderDonnees(data) {
        localStorage.setItem("maisonDesVins", JSON.stringify(data));
    }

    // AFFICHAGE VITRINE (GARDE LA FORME ORIGINALE)
    function afficherCategories() {
        const data = chargerDonnees();
        const container = document.getElementById("exceptions-container");
        if (!container) return;
        container.innerHTML = "";
        data.categoriesException.forEach(cat => {
            const div = document.createElement("div");
            div.className = "exception-card";
            div.textContent = cat;
            container.appendChild(div);
        });
    }

    function afficherVins() {
        const data = chargerDonnees();
        const container = document.getElementById("vitrine-vins");
        if (!container) return;
        container.innerHTML = "";
        data.vins.forEach(vin => {
            const carte = document.createElement("div");
            carte.className = "carte-vin";
            carte.innerHTML = `
                <h3>${vin.nom}</h3>
                <p>${vin.description}</p>
                <span class="prix">${vin.prix.toLocaleString()} FCFA</span>
            `;
            container.appendChild(carte);
        });
    }

    // GESTIONNAIRE
    function afficherMessage(msg, isError = false) {
        const msgDiv = document.getElementById("message");
        if (!msgDiv) return;
        msgDiv.textContent = msg;
        msgDiv.style.backgroundColor = isError ? "#e74c3c" : "#27ae60";
        msgDiv.classList.add("show");
        setTimeout(() => msgDiv.classList.remove("show"), 3000);
    }

    function majCategories() {
        const cat1 = document.getElementById("cat1").value.trim();
        const cat2 = document.getElementById("cat2").value.trim();
        const cat3 = document.getElementById("cat3").value.trim();
        const cat4 = document.getElementById("cat4").value.trim();
        if (!cat1 || !cat2 || !cat3 || !cat4) {
            afficherMessage("Remplissez les 4 catégories", true);
            return;
        }
        const data = chargerDonnees();
        data.categoriesException = [cat1, cat2, cat3, cat4];
        sauvegarderDonnees(data);
        afficherMessage("✅ Catégories mises à jour");
        chargerCategoriesExistantes();
        afficherCategories();
    }

    function ajouterVin() {
        const nom = document.getElementById("nomVin").value.trim();
        const desc = document.getElementById("descVin").value.trim();
        const prix = parseInt(document.getElementById("prixVin").value);
        if (!nom || !desc || isNaN(prix) || prix <= 0) {
            afficherMessage("Champs invalides", true);
            return;
        }
        const data = chargerDonnees();
        data.vins.push({ nom, description: desc, prix });
        sauvegarderDonnees(data);
        afficherMessage(`Vin "${nom}" ajouté`);
        document.getElementById("nomVin").value = "";
        document.getElementById("descVin").value = "";
        document.getElementById("prixVin").value = "";
        afficherListeVins();
        afficherVins();
    }

    function supprimerVin(index) {
        const data = chargerDonnees();
        const nom = data.vins[index].nom;
        data.vins.splice(index, 1);
        sauvegarderDonnees(data);
        afficherMessage(`"${nom}" supprimé`);
        afficherListeVins();
        afficherVins();
    }

    function afficherListeVins() {
        const data = chargerDonnees();
        const container = document.getElementById("liste-vins-container");
        if (!container) return;
        if (data.vins.length === 0) {
            container.innerHTML = "<p>Aucun vin</p>";
            return;
        }
        container.innerHTML = "";
        data.vins.forEach((vin, idx) => {
            const div = document.createElement("div");
            div.className = "vin-item";
            div.innerHTML = `
                <div class="vin-info">
                    <strong>${vin.nom}</strong><br>
                    ${vin.description.substring(0, 80)}<br>
                    ${vin.prix.toLocaleString()} FCFA
                </div>
                <button class="btn-supprimer" onclick="supprimerVin(${idx})">🗑</button>
            `;
            container.appendChild(div);
        });
    }

    function chargerCategoriesExistantes() {
        const data = chargerDonnees();
        if (data.categoriesException.length >= 4) {
            document.getElementById("cat1").value = data.categoriesException[0] || "";
            document.getElementById("cat2").value = data.categoriesException[1] || "";
            document.getElementById("cat3").value = data.categoriesException[2] || "";
            document.getElementById("cat4").value = data.categoriesException[3] || "";
        }
    }

    // CHANGEMENT DE MODE
    function changerMode(mode) {
        if (mode === 'gestionnaire') {
            document.body.classList.add('mode-gestionnaire');
            chargerCategoriesExistantes();
            afficherListeVins();
        } else {
            document.body.classList.remove('mode-gestionnaire');
            afficherCategories();
            afficherVins();
        }
    }

    // INIT
    chargerDonnees();
    changerMode('vitrine');
</script>
</body>
</html>
